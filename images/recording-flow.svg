<svg xmlns="http://www.w3.org/2000/svg" width="800" height="864" viewBox="0 0 800 864" role="img" aria-labelledby="title desc">
<title id="title">Recording flow</title>
<desc id="desc">Four steps: Record and allow the microphone; Finish manually or let the three-second recording end; Listen to the complete saved sample; choose beats and Play loop. Demo sounds are another starting point.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8ff61"/></marker></defs>
<rect x="0" y="0" width="800" height="864" rx="0" fill="#111610" stroke="none" stroke-width="1"/>
<text x="32" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#edf1e8" text-anchor="start">From recording to a loop</text><text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#c1cabb" text-anchor="start">The same steps apply to either track.</text><rect x="56" y="116" width="688" height="136" rx="10" fill="#1b221b" stroke="#3a4535" stroke-width="1"/><circle cx="102.00" cy="156.00" r="24" fill="#c8ff61" stroke="none" stroke-width="1"/><text x="102" y="164" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#111610" text-anchor="middle">1</text><text x="148" y="159" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#c8ff61" text-anchor="start">Record</text><text x="148" y="195" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#edf1e8" text-anchor="start">Allow microphone access.</text><text x="148" y="227" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#c1cabb" text-anchor="start">Make a short sound, up to 3 seconds.</text><path d="M 400 260 V 282" fill="none" stroke="#c8ff61" stroke-width="3" marker-end="url(#arrow)"/><rect x="56" y="292" width="688" height="136" rx="10" fill="#1b221b" stroke="#3a4535" stroke-width="1"/><circle cx="102.00" cy="332.00" r="24" fill="#c8ff61" stroke="none" stroke-width="1"/><text x="102" y="340" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#111610" text-anchor="middle">2</text><text x="148" y="335" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#c8ff61" text-anchor="start">Finish</text><text x="148" y="371" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#edf1e8" text-anchor="start">Press Finish to stop sooner.</text><text x="148" y="403" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#c1cabb" text-anchor="start">The recording also ends after 3 seconds.</text><path d="M 400 436 V 458" fill="none" stroke="#c8ff61" stroke-width="3" marker-end="url(#arrow)"/><rect x="56" y="468" width="688" height="136" rx="10" fill="#1b221b" stroke="#3a4535" stroke-width="1"/><circle cx="102.00" cy="508.00" r="24" fill="#c8ff61" stroke="none" stroke-width="1"/><text x="102" y="516" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#111610" text-anchor="middle">3</text><text x="148" y="511" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#c8ff61" text-anchor="start">Listen</text><text x="148" y="547" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#edf1e8" text-anchor="start">Hear the full saved sample.</text><text x="148" y="579" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#c1cabb" text-anchor="start">Check your sound before choosing beats.</text><path d="M 400 612 V 634" fill="none" stroke="#c8ff61" stroke-width="3" marker-end="url(#arrow)"/><rect x="56" y="644" width="688" height="136" rx="10" fill="#1b221b" stroke="#3a4535" stroke-width="1"/><circle cx="102.00" cy="684.00" r="24" fill="#c8ff61" stroke="none" stroke-width="1"/><text x="102" y="692" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#111610" text-anchor="middle">4</text><text x="148" y="687" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#c8ff61" text-anchor="start">Play loop</text><text x="148" y="723" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#edf1e8" text-anchor="start">Choose the beats you want to switch on.</text><text x="148" y="755" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#c1cabb" text-anchor="start">Listen to both tracks repeating together.</text><text x="32" y="828" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#c1cabb" text-anchor="start">You can also start with the built-in demo sounds.</text>
</svg>
