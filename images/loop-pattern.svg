<svg xmlns="http://www.w3.org/2000/svg" width="800" height="818" viewBox="0 0 800 818" role="img" aria-labelledby="title desc">
<title id="title">Eight-beat timing diagram</title>
<desc id="desc">A clockwise eight-beat cycle. Track A plays on beats 1 and 5. Track B plays on beats 3 and 7. Other beats are off. Beat 3 is outlined as an example current position. After beat 8 the loop returns to beat 1. This explains timing, not the shape of the on-screen controls.</desc>
<defs><marker id="beat-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#76836e"/></marker><marker id="repeat-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8ff61"/></marker></defs>
<rect x="0" y="0" width="800" height="818" rx="0" fill="#111610" stroke="none" stroke-width="1"/>
<text x="32" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#edf1e8" text-anchor="start">How the eight-beat loop repeats</text><text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#c1cabb" text-anchor="start">Example: Track A on 1 + 5; Track B on 3 + 7.</text><path d="M 449.94 189.69 A 222 222 0 0 1 517.64 217.73" fill="none" stroke="#76836e" stroke-width="3" marker-end="url(#beat-arrow)"/><circle cx="400.00" cy="184.00" r="40" fill="#c8ff61" stroke="#3a4535" stroke-width="1"/><text x="400.0" y="182.0" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#111610" text-anchor="middle">1</text><text x="400.0" y="207.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111610" text-anchor="middle">A</text><path d="M 588.27 288.36 A 222 222 0 0 1 616.31 356.06" fill="none" stroke="#76836e" stroke-width="3" marker-end="url(#beat-arrow)"/><circle cx="556.98" cy="249.02" r="40" fill="#1b221b" stroke="#3a4535" stroke-width="1"/><text x="556.9777054234136" y="247.02229457658646" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#c1cabb" text-anchor="middle">2</text><text x="556.9777054234136" y="272.02229457658643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#c1cabb" text-anchor="middle">OFF</text><path d="M 616.31 455.94 A 222 222 0 0 1 588.27 523.64" fill="none" stroke="#76836e" stroke-width="3" marker-end="url(#beat-arrow)"/><circle cx="622.00" cy="406.00" r="40" fill="#9ed9bc" stroke="#3a4535" stroke-width="1"/><circle cx="622.00" cy="406.00" r="47" fill="none" stroke="#edf1e8" stroke-width="2"/><text x="622.0" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#111610" text-anchor="middle">3</text><text x="622.0" y="429.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111610" text-anchor="middle">B</text><path d="M 517.64 594.27 A 222 222 0 0 1 449.94 622.31" fill="none" stroke="#76836e" stroke-width="3" marker-end="url(#beat-arrow)"/><circle cx="556.98" cy="562.98" r="40" fill="#1b221b" stroke="#3a4535" stroke-width="1"/><text x="556.9777054234136" y="560.9777054234136" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#c1cabb" text-anchor="middle">4</text><text x="556.9777054234136" y="585.9777054234136" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#c1cabb" text-anchor="middle">OFF</text><path d="M 350.06 622.31 A 222 222 0 0 1 282.36 594.27" fill="none" stroke="#76836e" stroke-width="3" marker-end="url(#beat-arrow)"/><circle cx="400.00" cy="628.00" r="40" fill="#c8ff61" stroke="#3a4535" stroke-width="1"/><text x="400.0" y="626.0" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#111610" text-anchor="middle">5</text><text x="400.0" y="651.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111610" text-anchor="middle">A</text><path d="M 211.73 523.64 A 222 222 0 0 1 183.69 455.94" fill="none" stroke="#76836e" stroke-width="3" marker-end="url(#beat-arrow)"/><circle cx="243.02" cy="562.98" r="40" fill="#1b221b" stroke="#3a4535" stroke-width="1"/><text x="243.02229457658646" y="560.9777054234136" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#c1cabb" text-anchor="middle">6</text><text x="243.02229457658646" y="585.9777054234136" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#c1cabb" text-anchor="middle">OFF</text><path d="M 183.69 356.06 A 222 222 0 0 1 211.73 288.36" fill="none" stroke="#76836e" stroke-width="3" marker-end="url(#beat-arrow)"/><circle cx="178.00" cy="406.00" r="40" fill="#9ed9bc" stroke="#3a4535" stroke-width="1"/><text x="178.0" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#111610" text-anchor="middle">7</text><text x="178.0" y="429.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#111610" text-anchor="middle">B</text><path d="M 282.36 217.73 A 222 222 0 0 1 350.06 189.69" fill="none" stroke="#c8ff61" stroke-width="3" marker-end="url(#repeat-arrow)"/><circle cx="243.02" cy="249.02" r="40" fill="#1b221b" stroke="#3a4535" stroke-width="1"/><text x="243.0222945765864" y="247.02229457658646" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#c1cabb" text-anchor="middle">8</text><text x="243.0222945765864" y="272.02229457658643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#c1cabb" text-anchor="middle">OFF</text><text x="400" y="398" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="bold" fill="#edf1e8" text-anchor="middle">8 beats</text><text x="400" y="436" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#c1cabb" text-anchor="middle">Repeat together</text><circle cx="66.00" cy="726.00" r="9" fill="#c8ff61" stroke="none" stroke-width="1"/><text x="86" y="734" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#edf1e8" text-anchor="start">Track A: beats 1 and 5</text><circle cx="424.00" cy="726.00" r="9" fill="#9ed9bc" stroke="none" stroke-width="1"/><text x="444" y="734" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#edf1e8" text-anchor="start">Track B: beats 3 and 7</text><text x="400" y="779" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#c1cabb" text-anchor="middle">After beat 8, playback returns to beat 1.</text>
</svg>
