<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop Together — Pocket Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header wrap">
    <a class="brand" href="index.html"><span class="mark">LT</span> LOOP TOGETHER</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Project</a>
      <a href="documentation.html">How it works ↗</a>
    </nav>
  </header>

  <main id="instrument" class="wrap">
    <div class="studio-heading">
      <div>
        <p class="eyebrow">YOUR SHARED SOUND SPACE</p>
        <h1>Pocket studio<span class="live-dot" aria-hidden="true"></span></h1>
      </div>
      <p>Take a sound. Make it yours.</p>
    </div>

    <!-- Transport: play, stop, tempo and export (shared by both tracks) -->
    <section class="transport" aria-label="Playback controls">
      <div class="transport-buttons">
        <button id="play" class="primary" disabled>▶ Play loop</button>
        <button id="stop" disabled>■ Stop</button>
      </div>
      <label class="tempo-label" for="tempo">
        TEMPO <output id="tempo-value">100 BPM</output>
        <input id="tempo" type="range" min="60" max="160" value="100">
        </label>
      <button id="export" disabled>Download WAV ↗</button>
    </section>

    <div class="workspace">
      <!-- Left panel: beat counter, state, short guide and microphone meter -->
      <aside class="session">
        <div class="session-head"><span class="eyebrow">SHARED LOOP</span><span class="tag">8 BEATS</span></div>
        <div class="beat-display"><strong id="beat">—</strong><span>/ 08</span></div> <div id="timeline" class="timeline" aria-hidden="true"></div> <!-- bars added by script.js -->
        <p id="state" class="state">READY TO PLAY</p>
        <div class="session-guide">
          <h2>Make it together</h2>
          <p><b>01</b> Try the demo rhythm.</p>
          <p><b>02</b> Record a sound each.</p>
          <p><b>03</b> Choose your beats.</p>
        </div>
        <label class="meter-label" for="meter">MICROPHONE INPUT</label>
        <meter id="meter" min="0" max="1" value="0">0</meter>
      </aside>
